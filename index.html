<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f3f1fb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="카메라 놀이터" />
  <title>카메라 놀이터</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0b0b12;
      --text: #1d1d1f;
      --muted: #6b6b76;
      --hairline: rgba(0, 0, 0, 0.1);
      --accent: #6a5cff;
      --display: "Poppins", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      --body: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100dvh;
      color: var(--text);
      font-family: var(--body);
      background: #f3f1fb;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* 배경 그라데이션 블롭 */
    .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden;
      background: linear-gradient(180deg, #eef1fb 0%, #f6f2fb 45%, #fbf4f8 100%); }
    .bg span { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.6; }
    .bg .b1 { width: 46vw; height: 46vw; left: -8vw; top: 2vw; background: #b7c6ff; }
    .bg .b2 { width: 42vw; height: 42vw; right: -6vw; top: 6vw; background: #f2b8e6; }
    .bg .b3 { width: 40vw; height: 40vw; left: 30vw; top: 40vw; background: #c9b3ff; opacity: 0.5; }

    /* 내비 */
    nav {
      display: flex; align-items: center; gap: 20px;
      max-width: 1120px; margin: 0 auto;
      padding: 20px max(22px, env(safe-area-inset-right)) 0 max(22px, env(safe-area-inset-left));
    }
    .brand { display: flex; align-items: center; gap: 10px; font-family: var(--display);
      font-weight: 800; font-size: 19px; color: var(--ink); text-decoration: none; letter-spacing: -0.01em; }
    .brand .mark { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 10px;
      background: linear-gradient(135deg, #6a5cff, #b96bff); color: #fff; font-size: 18px; }
    .nav-links { display: flex; gap: 26px; margin-left: auto; }
    .nav-links a { font-family: var(--display); font-weight: 500; font-size: 15px; color: var(--text); text-decoration: none; opacity: 0.85; }
    .nav-links a:hover { opacity: 1; }

    /* 히어로 */
    .hero { max-width: 900px; margin: 0 auto; padding: clamp(40px, 7vh, 84px) 22px 0; text-align: center; }
    .hero h1 { font-family: var(--display); font-weight: 800; font-size: clamp(2.5rem, 7.5vw, 4.4rem);
      line-height: 1.05; letter-spacing: -0.03em; color: var(--ink); margin: 0 0 20px; }
    .hero .lede { max-width: 30ch; margin: 0 auto 28px; font-size: clamp(1.05rem, 2.6vw, 1.28rem); line-height: 1.5; color: var(--muted); }
    .cta { display: flex; justify-content: center; flex-wrap: wrap; gap: 14px; }
    .btn { font-family: var(--display); font-weight: 600; font-size: 16px; border-radius: 999px; padding: 15px 28px; text-decoration: none; cursor: pointer; transition: transform 0.1s ease; }
    .btn-dark { background: var(--ink); color: #fff; border: none; }
    .btn-dark:active { transform: scale(0.97); }
    .btn-ghost { background: rgba(255, 255, 255, 0.6); color: var(--ink); border: 1px solid var(--hairline);
      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
    .btn-ghost:active { transform: scale(0.97); }

    /* 가운데 목업 (여기에 사진/영상 넣기) */
    .stage { position: relative; max-width: 900px; margin: clamp(40px, 7vh, 80px) auto 0; padding: 0 22px 100px; }
    .device {
      position: relative; border-radius: 26px; overflow: hidden;
      aspect-ratio: 16 / 10;
      background:
        linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px) 0 0 / 100% 9%,
        linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px) 0 0 / 8% 100%,
        #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05), 0 40px 90px rgba(80, 70, 160, 0.22);
    }
    .device .dot { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 7px; height: 7px; border-radius: 50%; background: rgba(0,0,0,0.15); }
    /* 사진을 넣으면 이 img의 src만 채우면 돼요 (자리는 그대로) */
    .device .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .device .placeholder { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; text-align: center; }
    .play { position: relative; display: grid; place-items: center; width: 92px; height: 92px; border-radius: 50%;
      background: linear-gradient(135deg, #7d8bff, #4aa8ff); color: #fff; box-shadow: 0 12px 30px rgba(74, 130, 255, 0.45); }
    .play::before, .play::after { content: ""; position: absolute; border: 1.5px solid rgba(74, 130, 255, 0.35); border-radius: 50%; }
    .play::before { width: 132px; height: 132px; }
    .play::after { width: 176px; height: 176px; }
    .play svg { width: 34px; height: 34px; margin-left: 5px; }

    /* 떠 있는 소개 카드 */
    .float { position: absolute; border-radius: 20px; background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.9); box-shadow: 0 20px 50px rgba(80, 70, 160, 0.22);
      -webkit-backdrop-filter: blur(20px) saturate(160%); backdrop-filter: blur(20px) saturate(160%);
      display: flex; flex-direction: column; justify-content: center; gap: 12px; padding: 22px; }
    .float .fi { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 15px; font-size: 28px; }
    .float .ft { font-family: var(--display); font-weight: 700; font-size: 19px; letter-spacing: -0.01em; color: var(--ink); line-height: 1.25; }
    .float .fs { font-size: 13.5px; color: var(--muted); line-height: 1.4; margin-top: -4px; }
    .float.tr { top: 11%; right: -4%; width: 25%; }
    .float.tr .fi { background: rgba(106, 92, 255, 0.14); }
    .float.bl { bottom: 13%; left: -4%; width: 27%; }
    .float.bl .fi { background: rgba(52, 199, 89, 0.16); }

    footer { text-align: center; color: var(--muted); font-size: 13px; padding: 0 22px 40px; }

    @media (max-width: 720px) {
      .nav-links { display: none; }
      .float { display: none; }

      .play { width: 74px; height: 74px; }
      .play::before { width: 108px; height: 108px; }
      .play::after { width: 144px; height: 144px; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <div class="bg"><span class="b1"></span><span class="b2"></span><span class="b3"></span></div>

  <nav>
    <a class="brand" href="index.html"><span class="mark">🎥</span>카메라 놀이터</a>
    <div class="nav-links">
      <a href="hand.html">손 3D</a>
      <a href="pingpong.html">탁구</a>
      <a href="study.html">공부 모드</a>
    </div>
  </nav>

  <header class="hero">
    <h1>카메라만 있으면<br />놀 준비 끝</h1>
    <p class="lede">손동작 미러, 팔 휘두르는 탁구, 졸음 막는 공부 모드까지. 설치 없이 브라우저에서 바로.</p>
    <div class="cta">
      <a class="btn btn-dark" href="hand.html">지금 해보기</a>
      <a class="btn btn-ghost" href="pingpong.html">탁구 치러 가기</a>
    </div>
  </header>

  <section class="stage">
    <div class="device">
      <img class="shot" src="design/study.png" alt="공부 모드 화면" />
    </div>

    <div class="float tr">
      <span class="fi">📖</span>
      <span class="ft">영어 단어장 정리</span>
      <span class="fs">PDF만 넣으면 Day별로 자동 정리</span>
    </div>
    <div class="float bl">
      <span class="fi">🎯</span>
      <span class="ft">퀴즈도 가능!</span>
      <span class="fs">틀린 단어는 다 맞출 때까지 반복</span>
    </div>
  </section>

  <footer>카메라는 각 화면에서 시작 버튼을 눌러야 켜져요.</footer>
</body>
</html>

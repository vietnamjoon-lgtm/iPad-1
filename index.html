<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f3f1fb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="카메라 놀이터" />
  <title>카메라 놀이터</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0b0b12;
      --text: #1d1d1f;
      --muted: #6b6b76;
      --hairline: rgba(0, 0, 0, 0.1);
      --accent: #6a5cff;
      --card: rgba(255, 255, 255, 0.72);
      --display: "Poppins", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      --body: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100dvh;
      color: var(--text);
      font-family: var(--body);
      background: #f3f1fb;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* 배경 그라데이션 블롭 */
    .bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      background: linear-gradient(180deg, #eef1fb 0%, #f6f2fb 45%, #fbf4f8 100%);
    }
    .bg span {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.6;
    }
    .bg .b1 { width: 46vw; height: 46vw; left: -8vw;  top: 2vw;  background: #b7c6ff; }
    .bg .b2 { width: 42vw; height: 42vw; right: -6vw; top: 6vw;  background: #f2b8e6; }
    .bg .b3 { width: 40vw; height: 40vw; left: 30vw;  top: 34vw; background: #c9b3ff; opacity: 0.5; }

    /* 내비 */
    nav {
      display: flex;
      align-items: center;
      gap: 20px;
      max-width: 1120px;
      margin: 0 auto;
      padding: 20px max(22px, env(safe-area-inset-right)) 0 max(22px, env(safe-area-inset-left));
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--display);
      font-weight: 800;
      font-size: 19px;
      color: var(--ink);
      text-decoration: none;
      letter-spacing: -0.01em;
    }
    .brand .mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, #6a5cff, #b96bff);
      color: #fff;
      font-size: 18px;
    }
    .nav-links {
      display: flex;
      gap: 26px;
      margin: 0 auto;
    }
    .nav-links a {
      font-family: var(--display);
      font-weight: 500;
      font-size: 15px;
      color: var(--text);
      text-decoration: none;
      opacity: 0.85;
    }
    .nav-links a:hover { opacity: 1; }
    .pill-dark {
      font-family: var(--display);
      font-weight: 600;
      font-size: 15px;
      color: #fff;
      background: var(--ink);
      border: none;
      border-radius: 999px;
      padding: 11px 22px;
      text-decoration: none;
      white-space: nowrap;
      transition: transform 0.1s ease, opacity 0.2s ease;
    }
    .pill-dark:active { transform: scale(0.97); }

    /* 히어로 */
    .hero {
      max-width: 900px;
      margin: 0 auto;
      padding: clamp(48px, 9vh, 96px) 22px 0;
      text-align: center;
    }
    .hero h1 {
      font-family: var(--display);
      font-weight: 800;
      font-size: clamp(2.6rem, 8vw, 4.6rem);
      line-height: 1.04;
      letter-spacing: -0.03em;
      color: var(--ink);
      margin: 0 0 22px;
    }
    .hero .lede {
      max-width: 30ch;
      margin: 0 auto 30px;
      font-size: clamp(1.05rem, 2.6vw, 1.3rem);
      line-height: 1.5;
      color: var(--muted);
    }
    .cta {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
    }
    .btn {
      font-family: var(--display);
      font-weight: 600;
      font-size: 16px;
      border-radius: 999px;
      padding: 15px 28px;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.2s ease;
    }
    .btn-dark { background: var(--ink); color: #fff; border: none; }
    .btn-dark:active { transform: scale(0.97); }
    .btn-ghost {
      background: rgba(255, 255, 255, 0.6);
      color: var(--ink);
      border: 1px solid var(--hairline);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
    }
    .btn-ghost:active { transform: scale(0.97); }

    /* 앱 카드 */
    .apps {
      max-width: 1000px;
      margin: 0 auto;
      padding: clamp(48px, 8vh, 88px) 22px 90px;
      position: relative;
    }
    .apps-note {
      position: absolute;
      top: clamp(24px, 5vh, 52px);
      right: 6%;
      font-family: "Caveat", cursive;
      font-weight: 700;
      font-size: 26px;
      color: var(--accent);
      transform: rotate(-6deg);
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }
    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 250px;
      padding: 28px 26px;
      border-radius: 26px;
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 22px 50px rgba(80, 70, 160, 0.12);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      backdrop-filter: blur(20px) saturate(160%);
      color: var(--text);
      text-decoration: none;
      transition: transform 0.35s cubic-bezier(0.2, 0.7, 0.2, 1), box-shadow 0.35s ease;
    }
    .card:hover, .card:focus-visible {
      transform: translateY(-6px);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06), 0 30px 70px rgba(80, 70, 160, 0.2);
      outline: none;
    }
    .card:active { transform: translateY(-2px) scale(0.995); }
    .card .icon {
      display: grid;
      place-items: center;
      width: 62px;
      height: 62px;
      border-radius: 18px;
      font-size: 34px;
      background: var(--tint);
      margin-bottom: auto;
    }
    .card .name {
      margin-top: 24px;
      font-family: var(--display);
      font-weight: 700;
      font-size: 23px;
      letter-spacing: -0.01em;
      color: var(--ink);
    }
    .card .desc { margin-top: 8px; font-size: 14.5px; line-height: 1.5; color: var(--muted); }
    .card .go { margin-top: 16px; font-family: var(--display); font-weight: 600; font-size: 14.5px; color: var(--accent); }
    .card .go::after { content: " ›"; }

    .hand  { --tint: rgba(106, 92, 255, 0.14); }
    .ping  { --tint: rgba(255, 149, 0, 0.16); }
    .study { --tint: rgba(52, 199, 89, 0.16); }

    footer { text-align: center; color: var(--muted); font-size: 13px; padding: 0 22px 40px; }

    @media (max-width: 680px) {
      .nav-links { display: none; }
      .apps-note { right: 4%; font-size: 22px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .card { transition: none; }
    }
  </style>
</head>
<body>
  <div class="bg"><span class="b1"></span><span class="b2"></span><span class="b3"></span></div>

  <nav>
    <a class="brand" href="index.html"><span class="mark">🎥</span>카메라 놀이터</a>
    <div class="nav-links">
      <a href="hand.html">손 3D</a>
      <a href="pingpong.html">탁구</a>
      <a href="study.html">공부 모드</a>
    </div>
    <a class="pill-dark" href="https://github.com/vietnamjoon-lgtm/iPad-1" target="_blank" rel="noopener">GitHub</a>
  </nav>

  <header class="hero">
    <h1>카메라만 있으면<br />놀 준비 끝</h1>
    <p class="lede">손동작 미러, 팔 휘두르는 탁구, 졸음 막는 공부 모드까지. 설치 없이 브라우저에서 바로.</p>
    <div class="cta">
      <a class="btn btn-dark" href="#apps">지금 해보기</a>
      <a class="btn btn-ghost" href="hand.html">손 3D부터 열기</a>
    </div>
  </header>

  <main class="apps" id="apps">
    <span class="apps-note">골라서 눌러요!</span>
    <div class="cards">
      <a class="card hand" href="hand.html">
        <span class="icon">🖐</span>
        <span class="name">손 3D 미러</span>
        <span class="desc">3D 손 모델이 내 손을 실시간으로 따라 움직여요.</span>
        <span class="go">열기</span>
      </a>
      <a class="card ping" href="pingpong.html">
        <span class="icon">🏓</span>
        <span class="name">1인칭 탁구</span>
        <span class="desc">팔을 휘둘러서 AI와 탁구를 쳐요.</span>
        <span class="go">열기</span>
      </a>
      <a class="card study" href="study.html">
        <span class="icon">📚</span>
        <span class="name">공부 모드</span>
        <span class="desc">졸면 알람이 울리고, 단어장으로 퀴즈도 풀어요.</span>
        <span class="go">열기</span>
      </a>
    </div>
  </main>

  <footer>카메라는 각 화면에서 시작 버튼을 눌러야 켜져요.</footer>
</body>
</html>
